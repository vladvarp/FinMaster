name: Deploy FAQ
"on":
  push:
    branches: [main]
    paths:
      - "FAQ/**"
      - "frontend/app/styles/**"
      - "frontend/mobile/styles/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать стили интерфейса для онлайн-справки
        run: |
          mkdir -p FAQ/assets
          cat frontend/app/styles/*.css > FAQ/assets/app.css
          cat frontend/mobile/styles/*.css > FAQ/assets/mobile.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FAQ
      - id: deployment
        uses: actions/deploy-pages@v4
        