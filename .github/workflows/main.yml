name: Deploy FAQ
"on":
  push:
    branches: [main]
    paths:
      - "FAQ/**"
      - "frontend/app/styles/**"
      - "frontend/mobile/styles/**"
      - "frontend/index.html"
      - "frontend/mobile.html"
      - "frontend/favicon.svg"
      - "frontend/favicon.png"
      - "frontend/favicon.ico"
      - ".github/workflows/main.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать стили интерфейса для онлайн-справки
        run: |
          mkdir -p FAQ/assets/source
          cat frontend/app/styles/*.css > FAQ/assets/app.css
          cat frontend/mobile/styles/*.css > FAQ/assets/mobile.css
          cp frontend/index.html FAQ/assets/source/app.html
          cp frontend/mobile.html FAQ/assets/source/mobile.html
          cp frontend/favicon.svg FAQ/assets/favicon.svg
          cp frontend/favicon.png FAQ/assets/favicon.png
          cp frontend/favicon.ico FAQ/assets/favicon.ico
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FAQ
      - id: deployment
        uses: actions/deploy-pages@v4
