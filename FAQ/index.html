<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справка FinMaster</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="256x256">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <script>
    (function () {
      const localAppHost = location.hostname === "127.0.0.1" || location.hostname === "localhost";
      const embedded = localAppHost && /^\/faq(?:\/|$)/.test(location.pathname);
      document.documentElement.dataset.faqMode = embedded ? "app" : "web";
      let saved = "";
      try {
        saved = localStorage.getItem(embedded ? "finmaster.theme" : "finmaster.faq.theme") || "";
      } catch (err) {}
      document.documentElement.dataset.theme = embedded ? (saved === "dark" ? "dark" : "light") : (saved === "light" ? "light" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/article.css">
  <link rel="stylesheet" href="css/experience.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0f766e"/>
          <path d="M8 10h16v2.4H8zm0 4.8h16v2.4H8zm0 4.8h10v2.4H8z" fill="#eafaf7"/>
        </svg>
        <strong>FinMaster</strong>
        <span>справка</span>
        <button class="side-toggle" id="side-collapse" type="button" title="Свернуть разделы" aria-label="Свернуть разделы" aria-expanded="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 6 8 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <input class="search" id="search" type="search" placeholder="Слова, &quot;фраза&quot;, -исключить" aria-label="Поиск по справке">
      <nav id="nav"></nav>
      <p class="side-copy"><span id="faq-copy">© V.Ar Production</span><br><a href="https://t.me/Var_production" target="_blank" rel="noopener">Telegram разработчика</a></p>
    </aside>
    <div class="main">
      <div class="top">
        <button class="menu" id="menu" type="button">Разделы</button>
        <div class="history-controls" role="group" aria-label="История переходов">
          <button class="tool-button" id="faq-back" type="button" disabled title="Назад" aria-label="Назад">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
          </button>
          <button class="tool-button" id="faq-forward" type="button" disabled title="Вперёд" aria-label="Вперёд">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="top-spacer"></div>
        <button class="tool-button theme-button" id="faq-theme" type="button" title="Переключить тему" aria-label="Переключить тему" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
      </div>
      <div class="doc">
        <nav class="here" id="here" hidden></nav>
        <div id="doc" aria-live="polite"></div>
        <aside class="link-map" id="link-map" aria-label="Карта переходов" hidden></aside>
      </div>
    </div>
  </div>
  <script src="js/toc.js"></script>
  <script src="js/live.js"></script>
  <script src="js/app.js"></script>
  <script src="js/experience.js"></script>
</body>
</html>
