<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("finmaster.theme")==="dark"?"dark":"light"}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="stage.css">
  <link rel="stylesheet" href="stand.css">
</head>
<body>
  <p class="hint">Пример карточек. Имя из заказа попадает в этот список само. Время считается с даты первого заказа.</p>
  <div class="card"><div class="table-wrap"><table class="data cust-table"><thead><tr>
    <th>Имя</th><th>Организация</th><th>Телефон</th><th>Почта</th><th>Адрес</th><th>Рейтинг</th><th>Совместная работа</th><th>Заказов</th><th></th>
  </tr></thead><tbody>
    <tr>
      <td><input value="Иванов" readonly tabindex="-1" aria-label="Имя"></td>
      <td><input value="ООО Север" readonly tabindex="-1" aria-label="Организация"></td>
      <td><input value="+7 900 000-00-01" readonly tabindex="-1" aria-label="Телефон"></td>
      <td><input value="ivanov@example.com" readonly tabindex="-1" aria-label="Почта"></td>
      <td><input value="ул. Лесная, 4" readonly tabindex="-1" aria-label="Адрес"></td>
      <td><div class="star-rating" title="4 из 5"><button type="button" class="star on" tabindex="-1">★</button><button type="button" class="star on" tabindex="-1">★</button><button type="button" class="star on" tabindex="-1">★</button><button type="button" class="star on" tabindex="-1">★</button><button type="button" class="star" tabindex="-1">★</button></div></td>
      <td class="meta">1 год 2 мес.</td>
      <td>3</td>
      <td><button class="btn small danger" type="button" disabled tabindex="-1">Удалить</button></td>
    </tr>
    <tr>
      <td><input value="Сидорова" readonly tabindex="-1" aria-label="Имя"></td>
      <td><input value="" readonly tabindex="-1" aria-label="Организация"></td>
      <td><input value="" readonly tabindex="-1" aria-label="Телефон"></td>
      <td><input value="" readonly tabindex="-1" aria-label="Почта"></td>
      <td><input value="" readonly tabindex="-1" aria-label="Адрес"></td>
      <td><div class="star-rating" title="без оценки"><button type="button" class="star" tabindex="-1">★</button><button type="button" class="star" tabindex="-1">★</button><button type="button" class="star" tabindex="-1">★</button><button type="button" class="star" tabindex="-1">★</button><button type="button" class="star" tabindex="-1">★</button></div></td>
      <td class="meta">3 мес.</td>
      <td>1</td>
      <td><button class="btn small danger" type="button" disabled tabindex="-1">Удалить</button></td>
    </tr>
  </tbody></table></div></div>
  <script src="chrome.js"></script>
  <script src="fit.js"></script>
</body>
</html>
