<!DOCTYPE html>
<html lang="ru" class="is-bank" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FinMaster — хранилище</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("finmaster.theme") === "dark" ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/bank.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <strong id="head-title">Хранилище</strong>
        <span id="head-sub">подключение…</span>
      </div>
      <button type="button" class="text-btn" id="btn-files" aria-label="Отчёты">Отчёты</button>
      <button type="button" class="icon-btn" id="btn-theme" aria-label="Тема">☾</button>
    </header>
    <div class="sync-bar" id="sync-bar"><span class="sync-dot"></span><span id="sync-text">синхронизация…</span></div>

    <main id="view-vault" class="vault-view active" hidden>
      <button type="button" class="calc-tab bank-ops" id="btn-ops" aria-label="Все операции">Все операции</button>
      <div class="calc-tabbar">
        <div class="calc-tabs" id="vault-tabs" role="tablist" aria-label="Страницы хранилища"></div>
        <button type="button" class="calc-tab add" data-add-vault-page="1" title="Новая страница-копилка">+</button>
      </div>
      <div class="vault-body" id="vault-body"></div>
    </main>

    <section class="empty" id="empty" hidden>
      <h2 id="empty-title">Нет отчёта</h2>
      <p id="empty-text">Выберите файл — он откроется на компьютере. Хранилище лежит в этом отчёте.</p>
      <div id="bank-files"></div>
    </section>

    <div class="blocker" id="blocker" hidden>
      <div>
        <h2 id="blocker-title">Нет доступа</h2>
        <p id="blocker-text"></p>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="modal" id="ask" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ask-title">
        <h3 id="ask-title">Подтвердите</h3>
        <p id="ask-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="ask-cancel">Отмена</button>
          <button type="button" class="btn primary" id="ask-ok">Удалить</button>
        </div>
      </div>
    </div>

    <script src="/charts.js"></script>
    <script src="/vault.js"></script>
    <script src="/bank.js"></script>
  </body>
</html>
