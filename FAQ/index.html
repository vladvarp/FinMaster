<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справка FinMaster</title>
  <script src="assets/web-mode.js" onerror="document.documentElement.dataset.faqMode='app'"></script>
  <script>try{const web=document.documentElement.dataset.faqMode==="web";const saved=localStorage.getItem("finmaster.theme");const theme=saved||(web?"dark":"light");if(web&&!saved)localStorage.setItem("finmaster.theme",theme);document.documentElement.dataset.theme=theme}catch(e){document.documentElement.dataset.theme=document.documentElement.dataset.faqMode==="web"?"dark":"light"}</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/article.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <strong>FinMaster</strong>
        <span>справка</span>
        <button class="side-toggle" id="side-collapse" type="button" title="Свернуть разделы" aria-label="Свернуть разделы" aria-expanded="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 6 8 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <input class="search" id="search" type="search" placeholder="Слова, &quot;фраза&quot;, -исключить" aria-label="Поиск по справке">
      <nav id="nav"></nav>
      <p class="side-copy"><span id="faq-copy">© V.Ar Production</span><br><a href="https://t.me/Var_production" target="_blank" rel="noopener">Telegram разработчика</a></p>
    </aside>
    <div class="main">
      <div class="top">
        <button class="menu" id="menu" type="button" aria-expanded="false">Разделы</button>
        <div class="top-actions" aria-label="Навигация по справке">
          <button class="nav-step" id="nav-back" type="button" aria-label="Назад по справке" title="Назад" disabled>←</button>
          <button class="nav-step" id="nav-forward" type="button" aria-label="Вперёд по справке" title="Вперёд" disabled>→</button>
          <span class="top-divider" aria-hidden="true"></span>
          <button class="theme" id="theme-toggle" type="button" hidden aria-label="Переключить тему" title="Переключить тему"><span class="theme-icon" aria-hidden="true">☀</span><span class="theme-label">Светлая тема</span></button>
        </div>
      </div>
      <div class="doc">
        <nav class="trail" id="trail" aria-label="Путь по справке"></nav>
        <nav class="here" id="here" hidden></nav>
        <div id="doc"></div>
      </div>
    </div>
  </div>
  <script src="js/toc.js"></script>
  <script src="js/live.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
