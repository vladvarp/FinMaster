<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("finmaster.theme")==="dark"?"dark":"light"}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="stage.css">
  <style>
    .modal-card.planner-modal { position: relative; width: min(980px, 100%); height: auto; max-height: none; }
    .planner-plan-wrap { flex: none; height: 280px; min-height: 0; }
    #mark-canvas { width: 100%; height: 280px; display: block; }
    .mark-film { position: relative; z-index: 1; }
    .faq-menu { position: absolute; z-index: 2; left: 46%; top: 38%; width: 210px; display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    .faq-menu button { border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; text-align: left; }
    .faq-menu b { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="modal-card planner-modal" role="dialog" aria-label="Электрика">
    <div class="planner-head">
      <input class="planner-title" value="Электрика" maxlength="48" readonly tabindex="-1" aria-label="Имя" />
      <button type="button" class="btn" tabindex="-1">Сброс</button>
      <button type="button" class="btn primary" tabindex="-1">Готово</button>
    </div>
    <div class="planner-body">
      <div class="planner-stage">
        <div class="planner-cap">Стена 1</div>
        <div class="planner-plan-wrap">
          <canvas id="mark-canvas"></canvas>
          <div class="faq-menu">
            <b>Ориентация</b>
            <button type="button" tabindex="-1">Горизонтально</button>
            <button type="button" tabindex="-1">Вертикально</button>
            <b>В секции: 3</b>
            <b>Розетки</b>
            <button type="button" tabindex="-1">В · Выключатель</button>
            <button type="button" tabindex="-1">Р · Розетка</button>
            <button type="button" tabindex="-1">И · Интернет</button>
            <b>Свет</b>
            <button type="button" tabindex="-1">Люстра</button>
            <button type="button" tabindex="-1">Спот</button>
            <button type="button" tabindex="-1">Прямоугольник</button>
            <button type="button" tabindex="-1">Линейный</button>
            <button type="button" tabindex="-1">Предустановки</button>
          </div>
        </div>
        <div class="planner-hint"><span>Правый клик ставит выбранную розетку в эту точку. Рамка собирает несколько типов.</span></div>
        <div class="mark-film">
          <button type="button" class="calc-film-card" tabindex="-1"><span class="calc-film-name">Пол</span><svg class="calc-film-thumb" style="--film-tone:#a78bfa" viewBox="0 0 64 46" aria-hidden="true"><path d="M8 10H56V36H8Z"/></svg></button>
          <button type="button" class="calc-film-card" tabindex="-1"><span class="calc-film-name">Потолок</span><svg class="calc-film-thumb is-ceiling" style="--film-tone:#facc15" viewBox="0 0 64 46" aria-hidden="true"><path d="M8 10H56V36H8Z"/><circle cx="32" cy="23" r="3"/></svg></button>
          <button type="button" class="calc-film-card is-on" tabindex="-1"><span class="calc-film-name">Стена 1</span><svg class="calc-film-thumb is-wall" style="--film-tone:#8bfaa7" viewBox="0 0 64 46" aria-hidden="true"><rect class="calc-film-wall" x="6" y="8" width="52" height="30"/><rect x="22" y="20" width="18" height="7"/></svg></button>
          <button type="button" class="calc-film-card" tabindex="-1"><span class="calc-film-name">Стена 2</span><svg class="calc-film-thumb is-wall" style="--film-tone:#8bfaa7" viewBox="0 0 64 46" aria-hidden="true"><rect class="calc-film-wall" x="6" y="8" width="52" height="30"/></svg></button>
        </div>
      </div>
      <div class="planner-side">
        <div class="planner-block">
          <div class="planner-block-h">Точки</div>
          <div class="planner-metric is-sel">
            <span class="planner-label">Рамка · горизонталь · В–Р–И</span>
            <label class="planner-len">1 <select tabindex="-1"><option>Выключатель</option></select></label>
            <label class="planner-len">2 <select tabindex="-1"><option>Розетка</option></select></label>
            <label class="planner-len">3 <select tabindex="-1"><option>Интернет</option></select></label>
          </div>
        </div>
        <div class="planner-block">
          <div class="planner-block-h">На ноду</div>
          <div class="planner-parts">
            <label class="planner-part"><input type="checkbox" checked tabindex="-1" /> <span>Выключатель</span> <em>1</em></label>
            <label class="planner-part"><input type="checkbox" checked tabindex="-1" /> <span>Розетка</span> <em>1</em></label>
            <label class="planner-part"><input type="checkbox" checked tabindex="-1" /> <span>Интернет</span> <em>1</em></label>
            <label class="planner-part"><input type="checkbox" checked tabindex="-1" /> <span>Рамка · горизонталь · В–Р–И</span> <em>1</em></label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById("mark-canvas");
      function fit() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx, w: rect.width, h: rect.height };
      }
      function draw() {
        const { ctx, w, h } = fit();
        const css = getComputedStyle(document.documentElement);
        const ink = css.getPropertyValue("--ink").trim() || "#0f172a";
        const card = css.getPropertyValue("--card").trim() || "#fff";
        const bg = css.getPropertyValue("--bg-2").trim() || "#f8fafc";
        const pad = 36;
        const scale = Math.min((w - pad * 2) / 4, (h - pad * 2) / 2.7);
        const ox = (w - 4 * scale) / 2;
        const oy = (h - 2.7 * scale) / 2;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#8bfaa7";
        ctx.globalAlpha = 0.24;
        ctx.fillRect(ox, oy, 4 * scale, 2.7 * scale);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#8bfaa7";
        ctx.lineWidth = 2;
        ctx.strokeRect(ox, oy, 4 * scale, 2.7 * scale);
        const cells = [
          ["В", "#38bdf8"],
          ["Р", "#f59e0b"],
          ["И", "#34d399"],
        ];
        const size = 0.16 * scale;
        const x0 = ox + 1.2 * scale;
        const y0 = oy + 1.5 * scale;
        cells.forEach((cell, i) => {
          const x = x0 + i * (size + 4);
          ctx.fillStyle = cell[1];
          ctx.strokeStyle = ink;
          ctx.lineWidth = 1.5;
          ctx.fillRect(x, y0, size, size);
          ctx.strokeRect(x, y0, size, size);
          ctx.fillStyle = "#1e293b";
          ctx.font = "700 13px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(cell[0], x + size / 2, y0 + size / 2);
        });
      }
      draw();
      window.addEventListener("resize", draw);
    })();
  </script>
</body>
</html>
